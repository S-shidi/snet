server {
    listen 8080 default_server;
    server_name _;

    root /var/www/snet;
    index index.html;

    # Web UI: serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Control API: proxy to snetd on 127.0.0.1:19432
    # Routes are /ctl/* — snetd registers them with the /ctl/ prefix
    location /ctl/ {
        proxy_pass http://127.0.0.1:19432;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
