server {
    listen 8080 default_server;
    server_name _;

    root /var/www/snet;
    index index.html;

    # Web UI: serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Control API: proxy to snetd on 127.0.0.1:19432
    # Routes are /ctl/* — snetd registers them with the /ctl/ prefix
    location /ctl/ {
        proxy_pass http://127.0.0.1:19432;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# TLS server (when certs are available)
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /data/certs/server.pem;
    ssl_certificate_key /data/certs/server-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/snet;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ctl/ {
        proxy_pass http://127.0.0.1:19432;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ /\. {
        deny all;
    }
}
