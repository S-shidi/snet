<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snet · Web 控制台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- toast -->
<div id="toast-wrap"></div>

<!-- modal -->
<div id="modal-root" hidden></div>

<!-- onboarding overlay -->
<div id="onboarding" hidden>
  <div class="onboarding-card">
    <div class="onboarding-logo">
      <div class="l-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <span class="l-title">Snet</span>
      <span class="l-sub">虚拟组网 · Web 控制台</span>
    </div>

    <div class="settings-block">
      <h3>绑定服务器</h3>
      <div class="row"><label>服务器地址</label><input id="onb-server" type="text" placeholder="https://example.com:8090" /></div>
      <div class="row"><label>设备授权码</label><input id="onb-code" type="text" placeholder="管理端生成的设备授权码" autocomplete="off" /></div>
      <div class="settings-actions">
        <button id="onb-bind" class="btn">绑定并进入</button>
      </div>
      <p class="msg" id="onb-bind-result"></p>
    </div>

    <div class="onboarding-skip">
      <a id="onb-skip">跳过，进入控制台</a>
      <span>跳过可查看状态，但需绑定后才能加入网络</span>
    </div>
  </div>
</div>

<!-- header -->
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <h1>Snet</h1>
        <span class="sub">虚拟组网 · Web 控制台</span>
      </div>
    </div>
    <div class="header-right">
      <span class="live-dot ok">snetd</span>
      <button class="btn sm" id="btn-refresh">刷新</button>
      <button class="btn sm" id="btn-settings">设置</button>
    </div>
  </div>
</header>

<!-- tabs -->
<div class="tabs">
  <button class="tab active" data-tab="networks">网络 <span class="cnt"></span></button>
  <button class="tab" data-tab="pending">待批准 <span class="cnt"></span></button>
  <button class="tab" data-tab="status">状态</button>
</div>

<!-- main -->
<div id="app-main">

  <!-- networks panel -->
  <div id="panel-networks" class="tab-panel active">
    <div class="toolbar">
      <button class="btn sm" id="btn-create">+ 创建</button>
      <button class="btn sm ghost" id="btn-join">加入</button>
      <span class="spacer"></span>
    </div>
    <div id="net-list"></div>
  </div>

  <!-- pending panel -->
  <div id="panel-pending" class="tab-panel">
    <div id="pending-list-panel"></div>
  </div>

  <!-- status panel -->
  <div id="panel-status" class="tab-panel">
    <div class="stats">
      <div class="stat"><div class="label">设备ID</div><div class="value" id="device-id">-</div></div>
      <div class="stat"><div class="label">服务器</div><div class="value accent" id="svc-server">-</div></div>
      <div class="stat"><div class="label">WireGuard 端口</div><div class="value" id="svc-wgport">-</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>隧道详情</h3></div>
      <div id="tunnel-detail"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>原始状态 JSON</h3></div>
      <pre id="status-json" class="json"></pre>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
