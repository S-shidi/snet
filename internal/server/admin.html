<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SNET控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f8cff'/%3E%3Ccircle cx='9' cy='16' r='4' fill='%23fff'/%3E%3Ccircle cx='23' cy='16' r='4' fill='%23fff'/%3E%3Cpath d='M13 16h6' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<script>
  const __snetPw = sessionStorage.getItem('vnet_admin_pw') === '1';
  if (sessionStorage.getItem('vnet_admin_tok')) document.documentElement.setAttribute('data-authed', '1');
  if (__snetPw) document.documentElement.setAttribute('data-pw', '1');
</script>
<style>
  :root {
    --bg:#0d1017; --bg2:#121722; --card:#161c29; --card2:#1b2334; --border:#252d40; --border2:#323c54;
    --text:#e8ecf4; --dim:#98a2b8; --faint:#6b7690;
    --accent:#4f8cff; --accent2:#6fa4ff; --accent-soft:rgba(79,140,255,.14);
    --ok:#3fb68b; --ok-soft:rgba(63,182,139,.14);
    --err:#e05252; --err-soft:rgba(224,82,82,.14);
    --warn:#d9a13a; --warn-soft:rgba(217,161,58,.14);
    --radius:12px; --radius-s:8px;
    --shadow:0 10px 34px rgba(0,0,0,.35);
    --ring:0 0 0 3px rgba(79,140,255,.35);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:
      radial-gradient(1200px 600px at 85% -10%, rgba(79,140,255,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(63,182,139,.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection { background:rgba(79,140,255,.35); }
  h1 { font-size:17px; margin:0; letter-spacing:.2px; }
  h2 { font-size:13px; color:var(--dim); font-weight:600; }
  h3 { font-size:14px; margin:0; font-weight:600; }
  a { color:var(--accent2); }
  button { font:inherit; }
  .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

  /* ── header ── */
  header {
    border-bottom:1px solid var(--border);
    background:rgba(22,28,41,.72); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:20;
  }
  .header-inner {
    display:flex; align-items:center; gap:10px;
    width:100%; max-width:1040px; margin:0 auto; padding:14px 22px;
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .logo {
    width:30px; height:30px; border-radius:8px; flex:none;
    background:linear-gradient(135deg,var(--accent),#7c5cff);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(79,140,255,.35);
  }
  .brand .logo svg { width:18px; height:18px; }
  .brand h1 { font-size:16px; font-weight:700; }
  .brand .sub { font-size:11px; color:var(--faint); }
  .spacer { flex:1; }
  .live-dot { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); margin-right:4px; }
  .live-dot::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }

  /* ── login ── */
  #login-card { margin:auto; width:100%; max-width:390px; }
  #main { display:none; width:100%; max-width:1040px; margin:0 auto; padding:20px 22px 60px; }
  html[data-authed] #main { display:block; }
  html[data-authed] #login-card { display:none; }
  #btn-refresh, #logout { display:none; }
  html[data-authed] #btn-refresh, html[data-authed] #logout { display:inline-flex; }
  #chpass { display:none; }
  html[data-authed][data-pw] #chpass { display:inline-flex; }

  .login-card {
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:30px 32px; box-shadow:var(--shadow);
  }
  .login-card .l-brand { display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:22px; text-align:center; }
  .login-card .l-logo { width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--accent),#7c5cff); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(79,140,255,.4); }
  .login-card .l-title { font-size:18px; font-weight:700; letter-spacing:.5px; }
  .login-card .l-sub { font-size:12px; color:var(--faint); }
  .login-card .row label { margin-bottom:6px; }
  .login-card .msg { min-height:18px; }

  /* ── buttons ── */
  .btn {
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
    background:var(--accent); color:#fff; border:1px solid transparent; border-radius:var(--radius-s);
    padding:7px 14px; font-size:13px; cursor:pointer; white-space:nowrap;
    transition:filter .12s, background .12s, border-color .12s, transform .04s;
  }
  .btn:hover { filter:brightness(1.08); }
  .btn:active { transform:translateY(1px); }
  .btn:focus-visible { outline:none; box-shadow:var(--ring); }
  .btn:disabled { opacity:.5; cursor:not-allowed; filter:none; }
  .btn.ghost { background:var(--card2); color:var(--text); border-color:var(--border); }
  .btn.ghost:hover { border-color:var(--border2); }
  .btn.danger { background:#8b3a3a; }
  .btn.danger.ghost { background:transparent; color:var(--err); border-color:rgba(224,82,82,.4); }
  .btn.danger.ghost:hover { background:var(--err-soft); }
  .btn.sm { padding:3px 9px; font-size:12px; border-radius:6px; }
  .btn.icon { padding:5px; width:28px; height:28px; border-radius:7px; background:transparent; color:var(--dim); border:1px solid transparent; }
  .btn.icon:hover { background:var(--card2); color:var(--text); border-color:var(--border); }

  /* ── tabs ── */
  .tabs { display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border); padding-bottom:0; }
  .tab {
    background:transparent; border:1px solid transparent; border-bottom:2px solid transparent;
    color:var(--dim); padding:9px 16px; font-size:13.5px; cursor:pointer; border-radius:8px 8px 0 0;
    transition:color .12s, background .12s;
  }
  .tab:hover { color:var(--text); background:rgba(255,255,255,.03); }
  .tab.active { color:var(--text); font-weight:600; border-bottom-color:var(--accent); }
  .tab .cnt { font-size:11px; color:var(--faint); margin-left:4px; }
  .tab .cnt.hot { color:var(--warn); font-weight:700; }

  /* ── toolbar ── */
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:16px; }
  .search { position:relative; flex:1; min-width:220px; }
  .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--faint); pointer-events:none; }
  .search input {
    width:100%; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-s);
    color:var(--text); padding:8px 12px 8px 32px; font-size:13px;
  }
  .search input:focus { outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    background:transparent; border:1px solid var(--border); color:var(--dim);
    padding:5px 12px; font-size:12px; border-radius:999px; cursor:pointer;
    transition:all .12s;
  }
  .chip:hover { color:var(--text); border-color:var(--border2); }
  .chip.active { background:var(--accent-soft); color:var(--accent2); border-color:var(--accent); }

  /* ── 网段输入控件 ── */
  .subnet-wrap { margin-top:4px; }
  .subnet-input { display:flex; gap:8px; align-items:stretch; }
  .subnet-input .subnet-base { flex:1; }
  .subnet-prefix {
    width:84px; flex-shrink:0; background:var(--bg); border:1px solid var(--border);
    border-radius:var(--radius-s); color:var(--text); padding:8px 6px; font-size:13px;
    outline:none; cursor:pointer;
  }
  .subnet-prefix:focus { outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .subnet-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .subnet-chips .chip {
    background:var(--bg2); border:1px solid var(--border); color:var(--dim);
    padding:3px 10px; font-size:12px; border-radius:999px; cursor:pointer;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .subnet-chips .chip:hover { color:var(--text); border-color:var(--border2); }
  .subnet-status { margin:7px 0 0; font-size:12px; min-height:16px; }
  .subnet-status.ok { color:var(--ok); }
  .subnet-status.warn { color:var(--warn); }
  .subnet-status.err { color:var(--err); }

  .qr { display:flex; justify-content:center; padding:14px 0; }
  .qr svg { width:100%; height:auto; max-width:200px; display:block; }

  /* ── cards ── */
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
  .card h3 { margin-bottom:10px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .card-head h3 { margin:0; }

  /* overview */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat {
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .stat .label { font-size:12px; color:var(--dim); margin-bottom:6px; }
  .stat .value { font-size:26px; font-weight:700; letter-spacing:.3px; font-variant-numeric:tabular-nums; }
  .stat .value.ok { color:var(--ok); }
  .stat .value.warn { color:var(--warn); }
  .stat .value.accent { color:var(--accent2); }
  .stat::after { content:""; position:absolute; right:-18px; top:-18px; width:70px; height:70px; border-radius:50%; background:rgba(79,140,255,.08); }
  .overview-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:860px){ .overview-grid { grid-template-columns:1fr; } }
  .recent-item { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .recent-item:last-child { border-bottom:0; }
  .recent-item .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recent-item .time { margin-left:auto; color:var(--faint); font-size:12px; white-space:nowrap; }
  .quick-actions { display:flex; flex-wrap:wrap; gap:8px; }

  /* ── network list ── */
  .net { border:1px solid var(--border); border-radius:var(--radius); background:var(--card); margin-bottom:12px; overflow:hidden; }
  .net-head { display:flex; align-items:flex-start; gap:10px; padding:14px 16px 6px; }
  .net-name { font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .net-id { font-size:11px; color:var(--faint); margin-top:2px; display:flex; align-items:center; gap:4px; }
  .net-meta { padding:6px 16px 8px; color:var(--dim); font-size:12.5px; display:flex; flex-wrap:wrap; gap:4px 12px; }
  .net-meta b { color:var(--text); font-weight:600; }
  .net-actions { display:flex; flex-wrap:wrap; gap:6px; padding:4px 16px 12px; }
  .net-members { border-top:1px solid var(--border); background:var(--bg2); }
  .net-members .wrap { padding:12px 16px; overflow-x:auto; }

  /* ── pills ── */
  .pill { display:inline-flex; align-items:center; gap:5px; padding:1px 9px; border-radius:999px; font-size:11.5px; font-weight:500; line-height:18px; white-space:nowrap; }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.online { background:var(--ok-soft); color:var(--ok); }
  .pill.offline { background:var(--err-soft); color:var(--err); }
  .pill.zombie { background:var(--warn-soft); color:var(--warn); }
  .pill.managed { background:var(--accent-soft); color:var(--accent2); }
  .pill.bound { background:var(--accent-soft); color:var(--accent2); }
  .pill.free { background:rgba(154,163,178,.12); color:var(--dim); }
  .pill.pending { background:var(--warn-soft); color:var(--warn); }
  .badge-dot { display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--err); color:#fff; font-size:11px; font-weight:700; }

  /* ── tables ── */
  .tbl-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--border); word-break:break-all; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  th { color:var(--dim); font-weight:600; font-size:11.5px; letter-spacing:.3px; background:var(--card2); white-space:nowrap; }
  tbody tr:hover { background:rgba(255,255,255,.025); }
  td.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .devnets td { background:var(--bg2); }

  /* ── forms ── */
  .row { margin-bottom:12px; }
  .row label { display:block; color:var(--dim); font-size:12px; margin-bottom:5px; }
  .row label.inline { display:inline-flex; align-items:center; gap:7px; color:var(--text); font-size:13px; cursor:pointer; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-s);
    color:var(--text); padding:8px 11px; font-size:13px;
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; }
  input[type=number] { width:90px; }

  /* ── modal ── */
  .modal-bg { position:fixed; inset:0; background:rgba(4,6,12,.6); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:18px; }
  .modal-bg[hidden] { display:none; }
  .modal {
    background:var(--card); border:1px solid var(--border2); border-radius:14px;
    width:460px; max-width:96vw; max-height:86vh; overflow-y:auto; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }
  .modal.wide { width:680px; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; padding:15px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card); border-radius:14px 14px 0 0; z-index:1; }
  .modal-head h3 { margin:0; font-size:15px; }
  .modal-body { padding:18px; }
  .modal-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .confirm-msg { margin:0 0 14px; color:var(--dim); font-size:13.5px; white-space:pre-wrap; }
  .confirm-msg b { color:var(--text); }

  /* ── toasts ── */
  #toast-wrap { position:fixed; top:16px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:200; pointer-events:none; }
  .toast {
    min-width:240px; max-width:340px; background:var(--card); border:1px solid var(--border2);
    border-left:3px solid var(--accent); border-radius:10px; padding:11px 14px; font-size:13px;
    box-shadow:var(--shadow); animation:slideIn .18s ease-out; pointer-events:auto; text-align:center;
  }
  .toast.ok { border-left-color:var(--ok); }
  .toast.err { border-left-color:var(--err); }
  .toast.warn { border-left-color:var(--warn); }
  @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
  .toast.out { opacity:0; transform:translateY(-8px); transition:all .2s; }

  /* ── empty / loading ── */
  .empty { text-align:center; padding:38px 16px; color:var(--dim); }
  .empty svg { width:38px; height:38px; color:var(--faint); margin-bottom:10px; opacity:.6; }
  .empty .t { font-size:14px; color:var(--text); margin-bottom:4px; }
  .empty .s { font-size:12px; color:var(--faint); }
  .loading { display:flex; align-items:center; gap:10px; padding:20px; color:var(--dim); font-size:13px; justify-content:center; }
  .spinner { width:16px; height:16px; border:2px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .msg { color:var(--err); font-size:12.5px; margin:6px 0 0; min-height:0; white-space:pre-wrap; }
  .msg.ok { color:var(--ok); }
  .hint { color:var(--dim); font-size:12px; }

  .fresh-codes { display:flex; flex-direction:column; gap:7px; margin-bottom:12px; }
  .fresh-code {
    display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px;
  }
  .fresh-code .code { flex:1; min-width:0; word-break:break-all; font-size:13.5px; letter-spacing:1px; user-select:all; }

  .copyable { display:inline-flex; align-items:center; gap:6px; }
  .copyable .val { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }

  .flex { display:flex; align-items:center; gap:10px; }
  .flex.wrap { flex-wrap:wrap; }
  .mt0 { margin-top:0; } .mb0 { margin-bottom:0; }

  @media (max-width:640px) {
    header { padding:12px 14px; }
    #main { padding:14px 14px 50px; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .modal-foot { flex-direction:row-reverse; }
    .brand .sub { display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="9" cy="16" r="4" fill="#fff"/><circle cx="23" cy="16" r="4" fill="#fff"/><path d="M13 16h6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
      </span>
      <span>
        <h1>SNET控制台</h1>
        <span class="sub">虚拟组网 · 服务端管理</span>
      </span>
    </div>
    <span class="spacer"></span>
    <span class="live-dot" id="live-ind" hidden>实时</span>
    <button type="button" class="btn ghost sm" id="btn-refresh" data-act="refresh-all">刷新</button>
    <button type="button" class="btn ghost sm" id="chpass" data-act="open-chpass">修改密码</button>
    <button type="button" class="btn danger ghost sm" id="logout" data-act="logout">退出</button>
  </div>
</header>

<!-- login -->
<section id="login-card" class="login-card">
  <div class="l-brand">
    <span class="l-logo">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none"><circle cx="9" cy="16" r="4" fill="#fff"/><circle cx="23" cy="16" r="4" fill="#fff"/><path d="M13 16h6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
    </span>
    <div class="l-title">SNET 控制台</div>
    <div class="l-sub">请登录以管理网络、设备与授权码</div>
  </div>
  <div class="row">
    <label for="user">用户名</label>
    <input id="user" type="text" placeholder="输入用户名" autocomplete="username" spellcheck="false" />
  </div>
  <div class="row">
    <label for="pass">密码</label>
    <input id="pass" type="password" placeholder="输入密码" autocomplete="current-password" />
  </div>
  <div class="row mb0">
    <button type="button" class="btn" id="btn-login" style="width:100%;padding:9px 14px">登 录</button>
  </div>
  <p class="msg" id="login-msg"></p>
</section>

<!-- app -->
<main id="main">
  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="overview" role="tab">总览</button>
    <button type="button" class="tab" data-tab="net" role="tab">网络<span class="cnt" id="cnt-net"></span></button>
    <button type="button" class="tab" data-tab="dev" role="tab">设备<span class="cnt" id="cnt-dev"></span></button>
    <button type="button" class="tab" data-tab="code" role="tab">授权码<span class="cnt" id="cnt-code"></span></button>
  </nav>

  <!-- 总览 -->
  <section id="view-overview" class="view" role="tabpanel">
    <div class="stats" id="ov-stats"></div>
    <div class="overview-grid">
      <div class="card">
        <div class="card-head"><h3>最近活跃网络</h3><button type="button" class="btn ghost sm" data-act="goto-net">查看全部</button></div>
        <div id="ov-recent"><div class="loading"><span class="spinner"></span>加载中…</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>快速操作</h3></div>
        <div class="quick-actions">
          <button type="button" class="btn" data-act="create-net">创建网络</button>
          <button type="button" class="btn ghost" data-act="goto-code">生成授权码</button>
          <button type="button" class="btn ghost" data-act="goto-dev">查看设备</button>
        </div>
        <p class="hint mt0" style="margin-top:14px">

          + buffer.getLengthInBits()

          + totalDataCount * 8

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {

      // padding

        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

        break;
      case 'Kanji' :

          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';

      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';

        case '>': escaped += '&gt;'; break;

        case '"': escaped += '&quot;'; break;

        ' █': '▄',

      var max = size - margin;

      var black = Array(cellSize+1).join('  ');

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { 'Authorization': 'Bearer ' + tok, ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}) },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    let t = '';
    try { t = (await r.json()).error || ''; } catch (_) {}
    if (!t) { try { t = await r.text(); } catch (_) {} }
    throw new Error(r.status + (t ? ' ' + t : ''));
  }
  if (r.status === 204) return null;
  return r.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function relSec(ts) {
  if (!ts) return '—';
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 90) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString();
}

function icon(name) {
  const I = {
    copy: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',

    alert: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M24 8 42 40H6L24 8z"/><path d="M24 20v9"/><circle cx="24" cy="33" r="1.2" fill="currentColor"/></svg>',
  };
  return I[name] || '';
}

async function copyText(text, btn) {
  const done = () => {
    if (!btn) return;
    const old = btn.innerHTML;
    btn.innerHTML = '<span style="color:var(--ok)">已复制</span>';
    setTimeout(() => { btn.innerHTML = old; }, 1400);
  };
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制到剪贴板');
    done();
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板'); done(); }
    catch (_) { toast('复制失败，请手动复制', 'err'); }
    ta.remove();
  }
}

function toast(msg, kind = 'ok') {
  const wrap = $('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, 2600);
}

  if (u32 >= 0xac100000 && u32 <= 0xac1fffff) return true;
  if (u32 >= 0xc0a80000 && u32 <= 0xc0a8ffff) return true;
  return false;

  const u32 = ((oct[0] << 24) | (oct[1] << 16) | (oct[2] << 8) | oct[3]) >>> 0;
  const base = subnetBaseU32(u32, prefix);
  if (!subnetIsPrivate(base)) return { ok: false, error: '仅支持私有内网段：10/8、172.16/12、192.168/16' };
  const value = u32ToIp(base) + '/' + prefix;
  if (base !== u32) return { ok: true, value, fix: true, text: '主机位应为 0，已修正为 ' + value };
  const capacity = Math.max(0, Math.pow(2, 32 - prefix) - 2).toLocaleString('en-US');
  return { ok: true, value, text: '✓ ' + value + ' · 私有网段，可容纳 ' + capacity + ' 台' };
}

function subnetWidgetHTML(opts) {
  opts = opts || {};
  const value = opts.value || '';
  let base = '';
  let prefix = 24;
  if (value) {
    const slash = value.indexOf('/');
    base = slash >= 0 ? value.slice(0, slash) : value;
    const p = Number(slash >= 0 ? value.slice(slash + 1) : '');
    if (Number.isInteger(p) && p >= 8 && p <= 24) prefix = p;
  }
  const prefixOpts = SUBNET_PREFIXES.map(p => `<option value="${p}" ${p === prefix ? 'selected' : ''}>/${p}</option>`).join('');
  const chips = SUBNET_CHIPS.map(c => `<button type="button" class="chip" data-subnet="${esc(c)}">${esc(c)}</button>`).join('');
  const empty = opts.emptyHint || opts.placeholder || '';
  return `
    <div class="subnet-wrap" data-empty="${esc(empty)}">
      <div class="subnet-input">
        <input id="${opts.id || ''}" class="subnet-base" type="text" value="${esc(base)}" placeholder="${esc(opts.placeholder || '如 10.88.0.0/24（留空自动分配）')}" spellcheck="false" autocomplete="off" />
        <select class="subnet-prefix" aria-label="前缀">${prefixOpts}</select>
      </div>
      <div class="subnet-chips">${chips}</div>
      <p class="subnet-status"></p>
    </div>`;
}

function subnetWidgetInit(wrap) {
  const input = wrap.querySelector('.subnet-base');
  const sel = wrap.querySelector('.subnet-prefix');
  const status = wrap.querySelector('.subnet-status');
  const emptyHint = wrap.dataset.empty || '';
  const render = () => {
    const s = input.value.trim();
    if (!s) { status.className = 'subnet-status'; status.textContent = emptyHint; return; }
    const chk = subnetCheck(s, Number(sel.value));
    if (!chk.ok) { status.className = 'subnet-status err'; status.textContent = chk.error; return; }
    status.className = chk.fix ? 'subnet-status warn' : 'subnet-status ok';
    status.textContent = chk.text;
  };
  input.addEventListener('input', () => {
    const m = input.value.match(/\/(\d{1,2})\s*$/);
    if (m) { const p = Number(m[1]); if ([...sel.options].some(o => Number(o.value) === p)) sel.value = String(p); }
    render();
  });
  sel.addEventListener('change', () => {
    const s = input.value.trim();
    const slash = s.indexOf('/');
    const base = slash >= 0 ? s.slice(0, slash) : s;
    if (base) input.value = base + '/' + sel.value;
    render();
  });
  wrap.querySelectorAll('.subnet-chips .chip').forEach(c => {
    c.addEventListener('click', () => {
      const v = c.dataset.subnet || '';
      input.value = v;
      const m = v.match(/\/(\d+)$/);
      if (m && [...sel.options].some(o => Number(o.value) === Number(m[1]))) sel.value = m[1];
      render();
    });
  });
  input.addEventListener('blur', () => {
    let s = input.value.trim();
    if (!s) return;
    // 补全不完整的 IPv4（如 10.88 → 10.88.0.0），再套用下拉前缀。
    const slashIdx = s.indexOf('/');
    const hostPart = (slashIdx >= 0 ? s.slice(0, slashIdx) : s).trim();
    const prefixPart = slashIdx >= 0 ? s.slice(slashIdx) : '';
    if (/^\d{1,3}(\.\d{1,3}){0,2}$/.test(hostPart)) {
      const parts = hostPart.split('.');
      while (parts.length < 4) parts.push('0');
      s = parts.join('.') + prefixPart;
    }
    input.value = s;
    const chk = subnetCheck(s, Number(sel.value));
    if (chk.ok && chk.value) input.value = chk.value;
    render();
  });
  render();
  return {
    check: () => subnetCheck(input.value.trim(), Number(sel.value)),
    get: () => { const c = subnetCheck(input.value.trim(), Number(sel.value)); return c.ok ? c.value : ''; },
  };
}

function setModal(title, html, wide) {
  $('modal-title').textContent = title;
  $('modal-box').className = 'modal' + (wide ? ' wide' : '');
  $('modal-body').innerHTML = html;
  $('modal').hidden = false;
  const f = $('modal-body').querySelector('input, select, textarea');
  if (f) setTimeout(() => f.focus(), 30);
}

function closeModal() {
  $('modal').hidden = true;
  $('modal-body').innerHTML = '';
}

function confirmDlg(opts) {
  return new Promise(resolve => {
    const { title = '确认操作', message = '', confirmText = '确认', danger = false, typed = '' } = opts;
    const disabled = typed ? 'disabled' : '';
    const btnClass = danger ? 'danger' : '';
    setModal(title, `
      <p class="confirm-msg">${message}</p>
      ${typed ? `
        <div class="row">
          <label>请输入 <b class="code">${esc(typed)}</b> 以确认</label>
          <input type="text" id="cf-typed" autocomplete="off" spellcheck="false" />
        </div>` : ''}
      <div class="modal-foot">
        <button type="button" class="btn ghost" data-act="confirm-no">取消</button>
        <button type="button" class="btn ${btnClass}" id="cf-yes" data-act="confirm-yes" ${disabled}>${esc(confirmText)}</button>
      </div>
    `);
    const inp = $('cf-typed');
    const yes = $('cf-yes');
    if (inp && yes) {
      inp.addEventListener('input', () => { yes.disabled = inp.value.trim() !== typed; });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !yes.disabled) { yes.click(); } });
    }
    confirmState = { resolve };
  });
}

function handleErr(e, ctx) {
  if (e && /^401/.test(e.message)) { toast('登录已失效，请重新登录', 'err'); logout(); return; }
  toast((ctx ? ctx + '：' : '') + (e && e.message ? e.message : '操作失败'), 'err');
}

/* ── auth ── */

async function login() {
  const user = $('user').value.trim();
  const pass = $('pass').value;
  const msg = $('login-msg');
  msg.textContent = '';
  if (!user || !pass) { msg.textContent = '请输入用户名和密码'; return; }
  const btn = $('btn-login');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const r = await api('POST', '/admin/login', { username: user, password: pass });
    tok = r.token;
    pwAuth = true;
    sessionStorage.setItem('vnet_admin_tok', tok);
    sessionStorage.setItem('vnet_admin_pw', '1');
    document.documentElement.setAttribute('data-authed', '1');
    document.documentElement.setAttribute('data-pw', '1');
    startApp();
  } catch (e) {
    msg.textContent = '登录失败：' + e.message.replace(/^\d+\s*/, '');
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
}

function logout() {
  tok = '';
  sessionStorage.removeItem('vnet_admin_tok');
  sessionStorage.removeItem('vnet_admin_pw');
  location.reload();
}

/* ── app boot / tabs ── */

function startApp() {
  if (tok) { $('live-ind').hidden = false; }
  loadAll(true);
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (document.hidden) return;
    if (tab === 'overview') loadOverview(false);
    else if (tab === 'net') loadNetworks(false);
    else if (tab === 'dev') loadDevices(false);
    else if (tab === 'code') loadAuthCodes(false);
  }, 30000);
}

async function loadAll(showLoading) {
  await Promise.all([loadOverview(showLoading), loadNetworks(showLoading), loadDevices(showLoading), loadAuthCodes(showLoading)]);
  updateCounts();
}

function showTab(name) {
  tab = name;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  ['overview', 'net', 'dev', 'code'].forEach(v => {
    $('view-' + v).hidden = v !== name;
  });
  if (name === 'overview') loadOverview(true);
  if (name === 'net') loadNetworks(true);
  if (name === 'dev') loadDevices(true);
  if (name === 'code') loadAuthCodes(true);
}

function updateCounts() {
  const pending = netData.reduce((a, n) => a + (n.network.pendingCount || 0), 0);
  $('cnt-net').textContent = netData.length ? String(netData.length) : '';
  $('cnt-dev').textContent = deviceData.length ? String(deviceData.length) : '';
  $('cnt-code').textContent = codeData.length ? String(codeData.length) : '';
  $('cnt-net').classList.toggle('hot', pending > 0);
}

/* ── overview ── */

async function loadOverview(showLoading) {
  try {
    const [nets, devs, codes] = await Promise.all([
      api('GET', '/admin/networks'),
      api('GET', '/admin/devices'),
      api('GET', '/admin/devices/authcodes'),
    ]);
    netData = nets || [];
    deviceData = (devs && devs.devices) || [];
    codeData = (codes && codes.codes) || [];
    renderOverview();
    updateCounts();
  } catch (e) { handleErr(e, '加载总览失败'); }
}

function renderOverview() {
  const nets = netData;
  const total = nets.length;
  const online = nets.filter(n => n.online).length;
  const nodes = nets.reduce((a, n) => a + (n.nodeCount || 0), 0);
  const bound = codeData.filter(c => (c.boundCount || 0) > 0).length;
  const free = codeData.length - bound;
  const pending = nets.reduce((a, n) => a + (n.network.pendingCount || 0), 0);

  $('ov-stats').innerHTML = `
    <div class="stat"><div class="label">网络总数</div><div class="value accent">${total}</div></div>
    <div class="stat"><div class="label">在线网络</div><div class="value ok">${online}</div></div>
    <div class="stat"><div class="label">节点总数</div><div class="value">${nodes}</div></div>
    <div class="stat"><div class="label">设备总数</div><div class="value">${deviceData.length}</div></div>
    <div class="stat"><div class="label">授权码 · 已绑定</div><div class="value accent">${bound}</div></div>
    <div class="stat"><div class="label">授权码 · 未绑定</div><div class="value ${free ? 'warn' : ''}">${free}</div></div>
    ${pending ? `<div class="stat"><div class="label">待批准加入</div><div class="value warn">${pending}</div></div>` : ''}`;

  const recent = [...nets].sort((a, b) => (b.lastActivityAt || 0) - (a.lastActivityAt || 0)).slice(0, 6);
  $('ov-recent').innerHTML = recent.length
    ? recent.map(n => `
        <div class="recent-item">
          <span class="pill ${n.online ? 'online' : 'offline'}">${n.online ? '在线' : '离线'}</span>
          <span class="name">${esc(n.network.name || n.network.id)}</span>
          <span class="time">${relSec(n.lastActivityAt)}</span>
        </div>`).join('')
    : '<div class="empty">' + icon('empty') + '<div class="t">暂无网络</div><div class="s">创建第一个网络开始组网</div></div>';
}

/* ── networks ── */

async function loadNetworks(showLoading) {
  const box = $('net-list');
  if (showLoading) box.innerHTML = '<div class="loading"><span class="spinner"></span>加载中…</div>';
  try {
    netData = await api('GET', '/admin/networks') || [];
    renderNets();
    updateCounts();
  } catch (e) { handleErr(e, '加载网络失败'); }
}

function filteredNets() {
  const q = ($('net-q') ? $('net-q').value.trim().toLowerCase() : '');
  const f = document.querySelector('#net-filters .chip.active');
  const status = f ? f.dataset.filter : 'all';
  return netData.filter(n => {
    const net = n.network || {};
    if (q) {
      const hay = ((net.name || '') + ' ' + (net.id || '') + ' ' + (net.subnet || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (status === 'online') return n.online;
    if (status === 'offline') return !n.online;
    if (status === 'managed') return !!net.managed;
    if (status === 'zombie') return !!n.zombie;
    if (status === 'pending') return (net.pendingCount || 0) > 0;
    return true;
  });
}

function renderNets() {
  const list = filteredNets();
  const box = $('net-list');
  if (!netData.length) {
    box.innerHTML = '<div class="card"><div class="empty">' + icon('empty') +
      '<div class="t">暂无网络</div><div class="s">点击右上角「创建网络」开始</div></div></div>';
    return;
  }
  if (!list.length) {
    box.innerHTML = '<div class="card"><div class="empty">' + icon('empty') +
      '<div class="t">没有匹配的网络</div><div class="s">调整搜索或筛选条件</div></div></div>';
    return;
  }
  box.innerHTML = '';
  for (const n of list) box.appendChild(netCard(n));
}

function netCard(n) {
  const net = n.network || {};
  const el = document.createElement('div');
  el.className = 'net';
  el.dataset.nid = net.id;

  const managed = !!net.managed;
  const pills = [];
  if (managed) pills.push('<span class="pill managed">服务端管理</span>');
  pills.push(n.online ? '<span class="pill online">在线</span>' : '<span class="pill offline">离线</span>');
  if (!managed && n.zombie) pills.push('<span class="pill zombie">僵尸 · 将自动清理</span>');
  if (net.approvalRequired) pills.push('<span class="pill pending">需批准</span>');
  if (net.pendingCount > 0) pills.push(`<span class="pill pending">${net.pendingCount} 待批准</span>`);

  const owner = managed ? '服务端' : esc(net.ownerDeviceId || '未认领');
  const reap = managed ? '服务端创建，不参与自动清理' : '超过 72 小时无设备在线将自动删除';

  el.innerHTML = `
    <div class="net-head">
      <div style="flex:1;min-width:0">
        <div class="net-name">
          ${esc(net.name || net.id)}
          ${pills.join(' ')}
        </div>
        <div class="net-id">
          <span class="code">${esc(net.id)}</span>
          <button type="button" class="btn icon sm" data-act="copy" data-copy="${esc(net.id)}" title="复制网络 ID">${icon('copy')}</button>
        </div>
      </div>
    </div>
    <div class="net-meta">
      <span>网段 <b>${esc(net.subnet || '10.88.0.0/24')}</b></span>
      <span>中继 <b>:${n.relayPort || '-'}</b></span>
      <span>网主 <b>${owner}</b></span>
      <span>成员 <b>${n.nodeCount || 0}</b></span>
      <span>创建 <b>${fmtTime(net.createdAt)}</b></span>
      <span>最近活跃 <b>${relSec(n.lastActivityAt)}</b></span>
      <span class="hint">${reap}</span>
    </div>
    <div class="net-actions">
      <button type="button" class="btn ghost sm" data-act="toggle-members" data-nid="${esc(net.id)}">查看成员</button>
      <button type="button" class="btn ghost sm" data-act="edit-net" data-nid="${esc(net.id)}">编辑设置</button>
      <button type="button" class="btn ghost sm" data-act="add-node" data-nid="${esc(net.id)}">添加节点</button>
      ${net.pendingCount > 0 ? `<button type="button" class="btn sm" data-act="show-pending" data-nid="${esc(net.id)}">待批准 (${net.pendingCount})</button>` : ''}
      <button type="button" class="btn ghost sm" data-act="invite-net" data-nid="${esc(net.id)}">邀请</button>
      <button type="button" class="btn ghost sm" data-act="view-code" data-nid="${esc(net.id)}">查看配对码</button>
      <button type="button" class="btn danger ghost sm" data-act="del-net" data-nid="${esc(net.id)}">删除网络</button>
    </div>
    <div class="net-members" hidden><div class="wrap" id="members-${esc(net.id)}"></div></div>`;
  return el;
}

async function toggleMembers(btn, nid) {
  const card = btn.closest('.net');
  const div = card.querySelector('.net-members');
  const box = $('members-' + nid);
  if (!div.hidden) { div.hidden = true; btn.textContent = '查看成员'; return; }
  div.hidden = false;
  btn.textContent = '收起';
  box.innerHTML = '<div class="loading"><span class="spinner"></span>加载成员…</div>';
  try {
    const nodes = await api('GET', '/admin/networks/' + nid + '/nodes') || [];
    if (!nodes.length) {
      box.innerHTML = '<p class="hint mb0">暂无成员节点</p>';
      return;
    }
    const now = Math.floor(Date.now() / 1000);
    let rows = '';
    for (const nd of nodes) {
      const online = nd.lastSeen ? (now - nd.lastSeen) < 60 : false;
      const pub = nd.publicKey ? nd.publicKey.slice(0, 14) + '…' : '-';
      rows += `<tr>
        <td class="mono">${esc(nd.id)}</td>
        <td class="mono">${esc(nd.ip)}</td>
        <td class="mono">${esc(nd.deviceId || '-')}</td>
        <td class="mono">${esc(pub)}</td>
        <td><span class="pill ${online ? 'online' : 'offline'}">${online ? '在线' : (nd.lastSeen ? '离线' : '活跃（网络级）')}</span></td>
        <td><button type="button" class="btn danger ghost sm" data-act="kick-node" data-nid="${esc(nid)}" data-node="${esc(nd.id)}">踢出</button></td>
      </tr>`;
    }
    box.innerHTML = `<table><thead><tr><th>节点</th><th>IP</th><th>设备</th><th>公钥</th><th>状态</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  } catch (e) { handleErr(e, '加载成员失败'); }
}

async function kickNode(nid, nodeID) {
  const ok = await confirmDlg({
    title: '踢出节点',
    message: `确定把节点 <b class="code">${esc(nodeID)}</b> 踢出网络 ${esc(nid)}？\n被踢设备将立即断开该网络。`,
    confirmText: '踢出', danger: true,
  });
  if (!ok) return;
  try {
    await api('DELETE', `/admin/networks/${nid}/nodes/${nodeID}`);
    toast('节点已踢出');
    loadNetworks(false);
  } catch (e) { handleErr(e, '踢出失败'); }

async function viewCode(nid) {
  let code = '';
  try {
    const info = await api('GET', '/admin/networks/' + nid);
    code = info.pairingCode || '';
  } catch (e) { handleErr(e, '获取配对码失败'); return; }
  if (!code) {
    // 服务器重启后配对码明文不落盘；此时自动生成新码（旧码作废）。
    try {
      const r = await api('POST', `/admin/networks/${nid}/code`);
      code = r.code;
      toast('原配对码不可用，已生成新码（旧码作废）');
    } catch (e) { handleErr(e, '生成配对码失败'); return; }
  }
  const name = (netData.find(n => n.network && n.network.id === nid) || {}).network?.name || nid;
  setModal('查看配对码 · ' + name, `
    <div class="fresh-code">
      <span class="code" id="pc-code" style="flex:1;font-size:15px;letter-spacing:1.5px">${esc(code)}</span>
      <button type="button" class="btn sm" data-act="copy" data-copy="${esc(code)}">${icon('copy')} 复制</button>
    </div>
    <p class="hint mt0">配对码含有效次数与时限；复制后分享给其他设备即可加入。</p>

      <button type="button" class="btn ghost" data-act="close-modal">关闭</button>
      <button type="button" class="btn danger" data-act="reset-code" data-nid="${esc(nid)}">重置配对码</button>
    </div>`);
}

// NormalizeCode 镜像 internal/protocol/link.go：去横线空格、转大写。
function normalizeCode(code) {
  return String(code || '').replace(/[-\s]/g, '').toUpperCase();
}

function renderQR(container, text) {
  if (!container || typeof qrcode !== 'function') return;
  container.innerHTML = '';
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const svg = qr.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
  container.innerHTML = svg;
}

async function resetCode(nid) {

async function doChpass() {
  const oldP = $('cp-old').value;
  const newP = $('cp-new').value;
  const confirmP = $('cp-confirm').value;
  const msg = $('cp-msg');
  msg.textContent = '';
  if (!oldP || !newP) { msg.textContent = '请输入旧密码与新密码'; return; }
  if (newP.length < 8) { msg.textContent = '新密码至少 8 位'; return; }
  if (newP !== confirmP) { msg.textContent = '两次输入的新密码不一致'; return; }
  try {
    await api('POST', '/admin/password', { oldPassword: oldP, newPassword: newP });
    closeModal();
    toast('密码已修改，请用新密码重新登录');
    setTimeout(logout, 800);
  } catch (e) {
    if (/^404/.test(e.message)) msg.textContent = '当前为 token 认证，未配置账号密码';
    else msg.textContent = '修改失败：' + e.message.replace(/^\d+\s*/, '');
  }
}

function filteredDevices() {

async function loadAuthCodes(showLoading) {

}

function renderCodes() {
  const body = $('code-body');
  if (!codeData.length) {
    body.innerHTML = '<tr><td colspan="5"><div class="empty">' + icon('empty') +
      '<div class="t">暂无授权码</div><div class="s">生成后分发给各设备用于绑定</div></div></td></tr>';
    return;
  }
  let rows = '';
  for (const c of codeData) {
    const bound = (c.boundCount || 0) > 0;
    const max = Math.max(1, c.maxBindings || 1);
    const statusPill = bound
      ? `<span class="pill bound">已绑定 ${c.boundCount}/${max}</span>`
      : `<span class="pill free">未绑定 0/${max}</span>`;
    const devices = bound
      ? `<div class="hint code" style="margin-top:4px">` + (c.boundDevices || []).map(d =>
          `<span class="code">${esc(d.deviceId)}</span> · ${fmtTime(d.boundAt)}<br/>`).join('') + `</div>`
      : '';
    rows += `<tr>
      <td class="mono">${esc(c.id)}</td>
      <td class="mono">${esc(c.code)}</td>
      <td>${statusPill}${devices}</td>
      <td>${fmtTime(c.createdAt)}</td>
      <td style="white-space:nowrap">
        ${(c.boundDevices || []).map(d => `<button type="button" class="btn ghost sm" data-act="unbind" data-dev="${esc(d.deviceId)}">解绑 ${esc(d.deviceId)}</button>`).join('')}
        <button type="button" class="btn danger ghost sm" data-act="revoke" data-id="${esc(c.id)}">吊销</button>
      </td>
    </tr>`;
  }
  body.innerHTML = rows;
}

async function genCodes() {
  const raw = parseInt($('auth-count').value || '10', 10);
  const count = Math.min(100, Math.max(1, isNaN(raw) ? 10 : raw));
  const rawBind = parseInt($('auth-bind').value || '1', 10);
  const maxBindings = Math.min(100, Math.max(1, isNaN(rawBind) ? 1 : rawBind));
  const msg = $('auth-msg');
  msg.textContent = '';
  try {
    const r = await api('POST', '/admin/devices/authcodes/generate', { count, maxBindings });
    const codes = r.codes || [];
    const ids = r.ids || [];
    const items = codes.map((c, i) => `
      <div class="fresh-code">
        <span class="code">${esc(c)}</span>
        <button type="button" class="btn sm" data-act="copy" data-copy="${esc(c)}">${icon('copy')} 复制</button>
        <span class="hint code" style="font-size:11px">${esc(ids[i] || '')}</span>
      </div>`).join('');
    setModal('新生成的设备授权码', `
      <p class="hint mt0">每个授权码可绑定 <b>${maxBindings}</b> 台设备。明文会保存在列表中，随时可查看复制。无需时可按 ID 吊销。</p>
      <div class="fresh-codes">${items}</div>
      <div class="modal-foot">
        <button type="button" class="btn" data-act="close-modal">完成</button>
      </div>`);
    loadAuthCodes(false);
  } catch (e) { msg.textContent = '生成失败：' + e.message.replace(/^\d+\s*/, ''); }
}

/* ── global click delegation ── */

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case 'copy':
      copyText(el.dataset.copy, el);
      break;
    case 'close-modal':
      closeModal();
      if (confirmState) { confirmState.resolve(false); confirmState = null; }
      break;
    case 'confirm-no':
      if (confirmState) { confirmState.resolve(false); confirmState = null; }
      closeModal();
      break;
    case 'confirm-yes':
      if (confirmState) { confirmState.resolve(true); confirmState = null; }
      closeModal();
      break;
    case 'login':
      login();
      break;
    case 'logout':
      logout();
      break;
    case 'refresh-all':
      loadAll(true);
      toast('已刷新');
      break;
    case 'open-chpass':
      openChpass();
      break;
    case 'create-net':
      openCreateNet();
      break;
    case 'do-create-net':
      doCreateNet();
      break;
    case 'edit-net':
      openEditNet(el.dataset.nid);
      break;
    case 'do-save-net':
      doSaveNet(el.dataset.nid);
      break;
    case 'add-node':
      openAddNode(el.dataset.nid);
      break;
    case 'do-add-node':
      doAddNode(el.dataset.nid);
      break;
    case 'toggle-members':
      toggleMembers(el, el.dataset.nid);
      break;
    case 'kick-node':
      kickNode(el.dataset.nid, el.dataset.node);
      break;
    case 'view-code':
      viewCode(el.dataset.nid);
      break;
    case 'invite-net':
      inviteNet(el.dataset.nid);
      break;
    case 'reset-code':
      resetCode(el.dataset.nid);
      break;
    case 'del-net':
      delNet(el.dataset.nid);
      break;
    case 'show-pending':
      showPending(el.dataset.nid);
      break;
    case 'approve':
      approvePending(el.dataset.nid, el.dataset.pid);
      break;
    case 'deny':
      denyPending(el.dataset.nid, el.dataset.pid);
      break;
    case 'do-chpass':
      doChpass();
      break;
    case 'dev-nets':
      devNets(el, el.dataset.dev);
      break;
    case 'gen-codes':
      genCodes();
      break;
    case 'revoke':
      revokeCode(el.dataset.id);
      break;
    case 'unbind':
      unbindCode(el.dataset.dev);
      break;
    case 'goto-net':
      showTab('net');
      break;
    case 'goto-dev':
      showTab('dev');
      break;
    case 'goto-code':
      showTab('code');
      break;
  }
});

$('net-filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#net-filters .chip').forEach(c => c.classList.toggle('active', c === chip));
  renderNets();
});

/* search inputs (debounced) */
let netQTimer = null;
$('net-q').addEventListener('input', () => {
  clearTimeout(netQTimer);
  netQTimer = setTimeout(renderNets, 200);
});
let devQTimer = null;
$('dev-q').addEventListener('input', () => {
  clearTimeout(devQTimer);
  devQTimer = setTimeout(renderDevices, 200);
});

/* Enter to login */
for (const id of ['user', 'pass']) {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
}
$('btn-login').addEventListener('click', login);

/* modal: click backdrop closes; Esc closes */
$('modal').addEventListener('mousedown', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').hidden) { closeModal(); if (confirmState) { confirmState.resolve(false); confirmState = null; } }
});

/* ── init ── */
if (tok) { startApp(); }
</script>
</body>
</html>
