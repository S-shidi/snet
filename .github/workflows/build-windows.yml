name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build daemon (windows/amd64)
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o build/windows-amd64/snetd.exe ./cmd/client/snetd
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o build/windows-amd64/snetctl.exe ./cmd/client/snetctl
          ls -la build/windows-amd64

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Build installer (NSIS)
        working-directory: desktop
        shell: bash
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: snet-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
